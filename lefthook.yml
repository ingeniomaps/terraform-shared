# Git hooks via Lefthook (https://github.com/evilmartians/lefthook)
# Install: go install github.com/evilmartians/lefthook@latest
# Then: lefthook install

commit-msg:
  commands:
    conventional:
      run: bash scripts/commit-msg.sh {1}

pre-commit:
  commands:
    module-sources:
      glob: "*.tf"
      run: bash gcp/scripts/check-module-sources.sh
