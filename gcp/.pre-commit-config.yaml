# Pre-commit hooks para Terraform
# Instalación: pipx install pre-commit && pre-commit install -c gcp/.pre-commit-config.yaml
# Uso: pre-commit run -c gcp/.pre-commit-config.yaml --all-files  (desde la raíz del repo)
# Requiere terraform y tflint en el PATH.

repos:
  # Hook para detectar archivos sensibles
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
        exclude: '\.md$'
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']

  # Hook para prevenir commits de archivos sensibles
  - repo: local
    hooks:
      - id: prevent-sensitive-files
        name: Prevenir archivos sensibles
        entry: gcp/scripts/prevent-sensitive-files.sh
        language: system
        pass_filenames: true
        stages: [pre-commit]

  # Hook para fijar de dónde salen los módulos (ver scripts/check-module-sources.sh)
  - repo: local
    hooks:
      - id: check-module-sources
        name: Verificar source de módulos
        entry: gcp/scripts/check-module-sources.sh
        language: system
        pass_filenames: false
        files: '\.tf(\.json)?$'
        stages: [pre-commit]

  # Hook para verificar que no hay archivos de estado
  - repo: local
    hooks:
      - id: check-bootstrap
        name: Verificar archivos de estado
        entry: gcp/scripts/check-no-tfstate.sh
        pass_filenames: false
        language: system
        stages: [pre-commit]

  # Hook para formato de Terraform
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.86.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args: ['--args=-no-color']
      - id: terraform_tflint
        args: ['--args=--only=terraform_deprecated_interpolation']

  # Hook para detectar secretos
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json
